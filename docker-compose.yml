services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: canvas
      POSTGRES_PASSWORD: canvas_dev_password
      POSTGRES_DB: canvas
    ports:
      # Host port 5433 (not 5432) to avoid colliding with a pre-existing local Postgres instance.
      - '5433:5432'
    volumes:
      - canvas_postgres_data:/var/lib/postgresql/data
      # Creates canvas_test (the Python tests' database) on first start, i.e. a new data volume.
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  canvas_postgres_data:
