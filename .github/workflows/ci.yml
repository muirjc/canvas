name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # canvas-qrvn: every production dependency's licence is on the allow-list, and the committed
      # THIRD-PARTY-NOTICES.md matches package-lock.json (run `npm run licenses` to regenerate).
      - run: npm run licenses:check
      # diagram-core must build first — api and web resolve it as a workspace dependency via its
      # built dist/ output (see packages/diagram-core/package.json "main"), not its TS source.
      - run: npm run build --workspace=@canvas/diagram-core
      - run: npm run build --workspace=@canvas/api
      - run: npm run build --workspace=@canvas/web
      # canvas-3s5.3: the CI validator Canvas commits to GitHub repositories (one bundled file).
      - run: npm run typecheck --workspace=@canvas/validator-cli
      - run: npm run build --workspace=@canvas/validator-cli

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build
    # canvas-jtm.8: apps/api's db layer is engine-agnostic (Postgres + SQLite, canvas-jtm epic) —
    # this matrix runs the identical test suite against both, so dialect parity is actually CI-
    # enforced, not just locally checked once. The postgres service container is declared
    # unconditionally (GitHub Actions has no clean way to omit a service per matrix leg within one
    # job) rather than split into two jobs — the sqlite leg simply never touches it. That costs a
    # few seconds of unused container startup on the sqlite leg, a small addition on top of the
    # roughly-doubled job count this matrix already, deliberately, costs (see the epic's plan's own
    # "Risks" section) — not worth two near-duplicate jobs to avoid.
    strategy:
      fail-fast: false
      matrix:
        db-client: [postgres, sqlite]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: canvas_dev_password
          POSTGRES_DB: canvas_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U canvas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@canvas/diagram-core
      # diagram-core has no database coupling at all (see CLAUDE.md's "Active Technologies") — one
      # run is enough, not per db-client, so it only runs on the postgres leg to avoid a pointless
      # duplicate.
      - name: diagram-core contract/unit tests
        if: matrix.db-client == 'postgres'
        run: npm run test --workspace=@canvas/diagram-core
      # canvas-3s5.3: no database either; its tests build and run the real bundle.
      - name: validator-cli tests
        if: matrix.db-client == 'postgres'
        run: npm run test --workspace=@canvas/validator-cli
      # canvas-1bty.4: the diagram-core bridge the Python service calls (no database).
      - name: diagram-bridge tests
        if: matrix.db-client == 'postgres'
        run: npm run test --workspace=@canvas/diagram-bridge
      - name: api contract tests
        # NODE_ENV=test makes the api fall back to the canvas_test DB / a fixed dev session
        # secret (see apps/api/src/config.ts) — no DATABASE_URL/SESSION_SECRET needed here.
        # TEST_DB_CLIENT selects the dialect (apps/api/src/config.ts); on the sqlite leg this runs
        # entirely against an in-memory database and never touches the postgres service above.
        env:
          TEST_DB_CLIENT: ${{ matrix.db-client }}
        run: npm run test --workspace=@canvas/api

  # canvas-1bty.1: the Python backend (apps/api-py), moving here from apps/api route group by route
  # group (docs/python-backend-assessment.md). Same Postgres/SQLite matrix as the TypeScript suite;
  # its Postgres tests use their own schema (canvas_py) in the same test database.
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db-client: [postgres, sqlite]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: canvas_dev_password
          POSTGRES_DB: canvas_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U canvas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    defaults:
      run:
        working-directory: apps/api-py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # canvas-1bty.4: the golden corpus runs through the diagram-core bridge (Node).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Build the diagram-core bridge
        working-directory: .
        run: |
          npm ci
          npm run build --workspace=@canvas/diagram-bridge
      - name: Install uv
        run: pipx install uv==0.13.1
      - run: uv python install 3.13
      - run: uv sync --frozen
      - name: Lint and format
        if: matrix.db-client == 'postgres'
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        if: matrix.db-client == 'postgres'
        run: uv run mypy
      - name: Tests
        env:
          TEST_DB_CLIENT: ${{ matrix.db-client }}
          # The corpus-through-the-bridge tests skip without the bundle; in CI they must run.
          REQUIRE_BRIDGE: '1'
        run: uv run pytest

  e2e-tests:
    runs-on: ubuntu-latest
    needs: lint-and-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: canvas_dev_password
          POSTGRES_DB: canvas
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U canvas"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://canvas:canvas_dev_password@localhost:5433/canvas
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      ALLOW_LOCAL_AUTH: 'true'
      WEB_ORIGINS: http://localhost:5173
      PORT: '3000'
      # The AI chat E2E specs drive the real HTTP/tool-execution/persistence pipeline against a
      # rule-based fake NLU (apps/api-py's canvas_api/ai/mock_model.py since canvas-1bty.12; the
      # TypeScript fallback's apps/api/src/ai/mock-nlu.ts) instead of a live provider, so CI needs
      # no API key and makes no network call. Without this the API server starts unconfigured and
      # every AI request fails at provider resolution.
      AI_PROVIDER: mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=@canvas/diagram-core
      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Seed database
        working-directory: apps/api
        run: |
          OUTPUT=$(npm run seed 2>&1 | tee /dev/stderr)
          PROJECT_ID=$(echo "$OUTPUT" | grep "Project id:" | awk '{print $NF}')
          echo "E2E_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
      # canvas-3s5: the GitHub approval spec (github-approval.spec.ts) drives the real API against
      # the in-memory fake GitHub as its own process. The fake writes its generated App key
      # (base64 of the PEM, one line) to a file; the API then gets the App settings below, so its
      # GitHub feature is on for the whole run (other specs are unaffected either way).
      - name: Start fake GitHub
        working-directory: apps/api
        run: |
          FAKE_GITHUB_PORT=3999 nohup npx tsx tests/helpers/fake-github-server.ts /tmp/fake-github.key > /tmp/fake-github.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3999/_fake/pulls > /dev/null; then
              {
                echo "GITHUB_APP_ID=12345"
                echo "GITHUB_APP_API_URL=http://127.0.0.1:3999"
                echo "GITHUB_APP_PRIVATE_KEY=$(cat /tmp/fake-github.key)"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "fake GitHub did not become healthy in time"; cat /tmp/fake-github.log; exit 1
      # canvas-1bty.6: as in Azure, the API forwards the route groups that have moved to the Python
      # service (apps/api/src/python/route-groups.ts), so this unchanged e2e suite is each phase's gate.
      - name: Install uv
        run: pipx install uv==0.13.1
      # canvas-1bty.8: the Python service parses and validates diagrams through the diagram-core bridge,
      # a sidecar on 127.0.0.1:7070 in Azure; the same here.
      - name: Start the diagram-core bridge
        run: |
          npm run build --workspace=@canvas/diagram-bridge
          nohup node packages/diagram-bridge/dist/bridge.mjs > /tmp/bridge.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:7070/health > /dev/null && exit 0
            sleep 1
          done
          echo "diagram-core bridge did not become healthy in time"; cat /tmp/bridge.log; exit 1
      - name: Start the Python service
        working-directory: apps/api-py
        env:
          DIAGRAM_BRIDGE_URL: http://127.0.0.1:7070
        run: |
          uv python install 3.13
          uv sync --frozen
          nohup uv run uvicorn canvas_api.main:app --host 127.0.0.1 --port 8000 > /tmp/api-py.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "PYTHON_API_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "Python service did not become healthy in time"; cat /tmp/api-py.log; exit 1
      - name: Start API server
        working-directory: apps/api
        run: |
          nohup npm run dev > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null; then
              # Forwarding is on: /py/me exists only in Python (401 signed out; 404 would mean not forwarded).
              status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/py/me)
              [ "$status" = "401" ] && exit 0
              echo "API is up but not forwarding to Python (/py/me -> $status)"; cat /tmp/api.log; exit 1
            fi
            sleep 1
          done
          echo "API server did not become healthy in time"; cat /tmp/api.log; exit 1
      # Playwright's own webServer config (apps/web/playwright.config.ts) starts the Vite dev
      # server automatically, so only the API needs to be started manually above.
      - name: Run Playwright E2E tests
        working-directory: apps/web
        run: npx playwright test
      - name: Show API, Python service and fake GitHub logs
        if: failure()
        run: |
          echo "--- API (last 200 lines) ---"; tail -n 200 /tmp/api.log || true
          echo "--- Python service (last 200 lines) ---"; tail -n 200 /tmp/api-py.log || true
          echo "--- fake GitHub ---"; tail -n 100 /tmp/fake-github.log || true
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Security scanning. These run in parallel with the build/test jobs rather than
  # after them, so they add no wall-clock time to the pipeline.
  #
  # Gating policy differs per tool, chosen from what each actually reports on this
  # codebase rather than a blanket setting:
  #   - gitleaks: any finding fails. A committed secret is never acceptable, and
  #     the repository is currently clean, so this bar costs nothing to hold.
  #   - semgrep:  ERROR-severity findings fail; WARNING is reported. There are
  #     currently 0 errors and 13 warnings (mutable action tags, direct response
  #     writes) — advisory, not defects.
  #   - bearer:   CRITICAL fails; high/medium/low are reported. The prior HIGH
  #     (manual XML escaping in the SVG renderer not covering apostrophes) is
  #     fixed as of jmuir-t2p — escapeXml now maps every XML-sensitive character,
  #     not just the ones every call site happened to need at the time. The one
  #     MEDIUM is a false positive — the session cookie already sets httpOnly,
  #     sameSite and secure.
  #
  # All three also upload SARIF, so findings appear in the repository's Security
  # tab with history, not only in a job log that scrolls away.
  # ---------------------------------------------------------------------------

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret that was committed and later removed is still
          # exposed, so scanning only the tip would miss the cases that matter most.
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest detect \
            --source=. --no-banner --redact --exit-code 1

  sast-semgrep:
    name: sast-semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep scan (all severities, for the Security tab)
        run: |
          semgrep scan \
            --config=p/typescript --config=p/react \
            --config=p/security-audit --config=p/owasp-top-ten \
            --exclude=node_modules --exclude=dist \
            --exclude=playwright-report --exclude=test-results \
            --metrics=off --sarif --output=semgrep.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Fail on ERROR-severity findings
        run: |
          semgrep scan \
            --config=p/typescript --config=p/react \
            --config=p/security-audit --config=p/owasp-top-ten \
            --exclude=node_modules --exclude=dist \
            --exclude=playwright-report --exclude=test-results \
            --metrics=off --severity=ERROR --error

  sast-bearer:
    name: sast-bearer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    env:
      # canvas-hq7: the Bearer CLI release both steps install. Without it the action downloads
      # whatever is newest on every run -- a failed "latest" lookup broke the job (#246), and a new
      # release can silently change which rules fire. Upgrade by changing this, deliberately.
      BEARER_VERSION: 2.1.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bearer scan (all severities, for the Security tab)
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          version: ${{ env.BEARER_VERSION }}
          skip-path: node_modules,dist,playwright-report,test-results
          format: sarif
          output: bearer.sarif
          exit-code: 0
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: bearer.sarif
          category: bearer
      - name: Fail on critical findings
        uses: bearer/bearer-action@828eeb928ce2f4a7ca5ed57fb8b59508cb8c79bc # v2
        with:
          version: ${{ env.BEARER_VERSION }}
          skip-path: node_modules,dist,playwright-report,test-results
          severity: critical
