# canvas-b4o: every action in .github/workflows/ is pinned to a full commit SHA (with the version as
# a trailing comment); Dependabot keeps those pins current. GitHub Actions only -- npm dependencies
# are updated deliberately, not by bot.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Only propose a release once it's been out 14 days, so a bad or compromised release has time
    # to be noticed and pulled before it reaches CI. (Security updates aren't delayed.)
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ['*']
