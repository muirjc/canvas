<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Canvas is paused</title>
    <!-- canvas-vnh: pause.sh serves this in place of the app's index.html while the environment is
         paused (the database is stopped, so the app couldn't sign anyone in); resume.sh puts the
         app back. Self-contained: no scripts, fonts or other files. -->
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #16181d;
        --muted: #5b6270;
        --accent: #2a6fa8;
        --border: #d9dde3;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15171b;
          --card: #1e2126;
          --text: #e8eaed;
          --muted: #a3a9b4;
          --accent: #6aa8dc;
          --border: #343842;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 32px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        text-align: center;
      }
      .mark {
        color: var(--accent);
        font-size: 28px;
        line-height: 1;
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">◆</div>
      <h1>Canvas is paused</h1>
      <p>This environment is switched off for now to save costs. Your diagrams are safe, and everything will be back as it was when it's resumed.</p>
    </main>
  </body>
</html>
